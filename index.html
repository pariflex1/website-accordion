<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Services</title>
<style>
:root{--bg:#fff;--ink:#1c2b33;--mute:#465a69;--line:#ced0d4;--acc:#0064e0;--btn:#e4e6eb;--btn-hover:#d8dbe0;--glow:rgba(0,100,224,.1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081217;--ink:#f1f6f9;--mute:#aab9c4;--line:#2a3d48;--acc:#65b5ff;--btn:#1c303b;--btn-hover:#294552;--glow:rgba(53,153,255,.2)}}
:root[data-theme="dark"]{--bg:#081217;--ink:#f1f6f9;--mute:#aab9c4;--line:#2a3d48;--acc:#65b5ff;--btn:#1c303b;--btn-hover:#294552;--glow:rgba(53,153,255,.2)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% -8%,var(--glow),transparent 33rem),var(--bg);color:var(--ink);font-family:"Optimistic Display","Optimistic Text","Segoe UI",Helvetica,Arial,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
main{max-width:800px;margin:0 auto;padding:32px 20px 56px}
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 16px}
h1{flex:1;font-size:clamp(2rem,8vw,3.5rem);line-height:1.08;font-weight:500;letter-spacing:-.03em;margin:0}
.theme-toggle{flex:none;display:inline-flex;align-items:center;gap:8px;width:auto;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--btn);color:var(--ink);font-size:.875rem;font-weight:600;line-height:1;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.theme-toggle:hover{background:var(--btn-hover)}
.theme-icon{width:16px;text-align:center;font-size:1.1rem;line-height:1}
.lead{color:var(--mute);font-size:1.0625rem;margin:0 0 32px;max-width:52ch}
button{font:inherit;color:inherit;background:none;border:0;width:100%;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.svc{border-top:1px solid var(--line)}
.svc:last-child{border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:16px;padding:22px 0;min-height:72px}
.ttl{flex:1}
.ttl b{display:block;font-size:clamp(1.25rem,5vw,1.75rem);line-height:1.2;font-weight:500;letter-spacing:-.015em}
.ttl span{display:block;margin-top:4px;font-size:.875rem;color:var(--mute)}
.ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--btn);display:grid;place-items:center;transition:background .2s}
.ic svg{width:16px;height:16px}
.ic .v{transform-origin:center;transition:transform .25s}
[aria-expanded="true"] .ic .v{transform:scaleY(0)}
[aria-expanded="true"] .ic{background:var(--acc);color:#fff}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.open>.panel{grid-template-rows:1fr}
.panel>div{overflow:hidden;min-height:0}
.intro{margin:0 0 12px;color:var(--mute);font-size:1rem;max-width:56ch}
.list{padding-bottom:20px}
.item{border-top:1px solid var(--line)}
.q{display:flex;align-items:center;gap:10px;padding:12px 0;min-height:48px;font-size:1rem;font-weight:500;line-height:1.3}
.q>span:first-child{flex:1}
.q .ic{width:26px;height:26px}
.q .ic svg{width:11px;height:11px}
.item.open .q{color:var(--acc)}
.ans{margin:0;padding:0 36px 14px 0;color:var(--mute);font-size:.97rem;line-height:1.55;max-width:60ch}
@media (min-width:700px){main{padding-top:72px}.head{padding:28px 0}.q{padding:14px 0}}
@media (max-width:420px){.masthead{gap:10px}.theme-toggle{padding:8px 10px}.theme-label{display:none}}
@media (prefers-reduced-motion:reduce){.panel,.ic,.ic .v,.theme-toggle,body{transition:none}}
</style>
</head>
<body>
<main>
<div class="masthead">
<h1>Our Services</h1>
<button class="theme-toggle" type="button" id="themeToggle" aria-pressed="true" aria-label="Switch to light theme"><span class="theme-icon" id="themeIcon" aria-hidden="true">☀</span><span class="theme-label" id="themeLabel">Light mode</span></button>
</div>
<p class="lead">Websites, business software, AI automation and paid ads, built for growing businesses. Tap a service to see what we deliver.</p>
<div id="acc"></div>
</main>

<script>
var D=[
{t:"Website Development",s:"12 website types",i:"From a single landing page to a full online store, we build fast, mobile-friendly sites that look professional and turn visitors into enquiries.",l:[

["Real Estate Websites","Project and property showcases with galleries, floor plans, location maps, enquiry forms and WhatsApp call buttons to capture buyer leads."],

["Educational Websites","Engaging websites for schools, colleges, coaching centres and course providers, with programme details, admissions information, enquiry forms and resource pages."],
["WordPress Websites","Easy-to-manage WordPress sites with a custom theme, so your team can update pages and blog posts without technical help."],
["CMS Websites","Content-managed websites that let your team add, edit and publish pages, articles, media and updates without depending on a developer."],
["Custom Websites","Fully custom design and features built around your process, for needs that ready-made templates cannot meet."],
["Website Redesign","We refresh outdated sites with a modern look, better navigation and faster speed, while keeping your content and search rankings safe."],
["SEO-ready Websites","Clean code, fast loading, proper headings, meta tags, sitemap and schema so search engines can read your site and rank it."]]},

{t:"Web & Application Development",s:"10 software solutions",i:"Custom software that replaces spreadsheets and manual work, so your team saves time and your data stays organised in one place.",l:[
["React & Vite Applications","Fast, app-like interfaces built with React and Vite, including installable progressive web apps that work well on phones."],
["Next.js Applications","Server-rendered apps with excellent speed and SEO, ideal for public websites that also need logins, dashboards or dynamic content."],
["Node.js Backend Development","Secure servers and APIs that handle your data, user accounts, payments and business logic reliably as you grow."],
["Custom Web Applications","Browser-based tools designed around your exact workflow, from booking systems to internal portals for staff and customers."],
["CRM & ERP Systems","Track leads, customers, sales, inventory and accounts in one system, with roles, reports and follow-up reminders for your team."],
["SaaS Platforms","Subscription-based products with multi-tenant accounts, billing, plans and admin controls, ready to serve many customers at once."],
["Admin Dashboards","Clear dashboards with charts, tables, filters and exports so owners can see sales, team activity and key numbers at a glance."],
["Business Management Systems","Digital tools for attendance, payroll, project progress, payments and approvals that replace paperwork and manual follow-ups."],
["API & Third-party Integrations","Connect your software with payment gateways, WhatsApp, SMS, email, maps and other services so data flows without re-entry."],
["Mobile & Cross-platform Applications","One codebase that runs on Android, iOS and the web, including GPS and camera features for field teams and customers."]]},

{t:"AI Solutions & Automation",s:"12 AI and automation services",i:"Put AI to work on repetitive tasks: answer customers instantly, follow up on leads automatically and save hours every day.",l:[
["Custom AI Chatbots","Chatbots trained on your business that answer questions, qualify visitors and hand over to your team when a human is needed."],
["Website AI Assistants","A smart assistant on your site that guides visitors, explains services or projects and captures their contact details around the clock."],
["WhatsApp AI Chatbots","Automated WhatsApp replies in Hindi, English or Hinglish that share details, answer queries and book site visits or calls."],
["AI Knowledge-base Chatbots","Upload your brochures, price lists and FAQs, and the bot answers from that material accurately instead of guessing."],
["AI Agents","Agents that complete multi-step tasks for you, such as researching, updating records, sending messages and reporting back."],

["n8n Workflow Automation","Custom n8n workflows that connect your forms, CRM, WhatsApp, email and business tools so routine tasks run automatically and reliably."],
["Webhook Integrations","Set up reliable webhook connections that instantly send and receive events between your website, apps and third-party tools without manual updates."],

["AI-powered CRM","A CRM that scores leads, suggests next actions, summarises conversations and reminds your team who to call and when."],
["Document & Data Automation","Extract data from PDFs, invoices and forms, fill templates and generate reports or quotations automatically and accurately."],

{t:"Facebook & Instagram Ads",s:"10 Meta ads services",i:"Reach the right people on Facebook and Instagram, generate quality enquiries and track exactly what your ad budget delivers.",l:[
["Meta Ads Strategy","A clear plan covering goals, budget, audience, offer and funnel, so every rupee you spend is aimed at measurable results."],
["Facebook & Instagram Campaigns","We set up, launch and manage campaigns across feeds, stories and reels with the right structure, placements and schedule."],
["Lead Generation","Lead form and landing page campaigns that bring in genuine enquiries with names and phone numbers, ready for your sales team."],
["Conversion Campaigns","Campaigns optimised for actions that matter, such as purchases, calls, messages or site visit bookings, not just clicks."],
["Audience Targeting","Reach people by location, age, interests and behaviour, plus custom and lookalike audiences built from your existing customers."],
["Retargeting","Show ads again to people who visited your site, watched your videos or messaged you, and bring them back to take action."],
["Ad Creative & Copy","Eye-catching images, videos and persuasive Hindi or English copy designed to stop the scroll and drive a response."],
["Pixel & Conversion API","Correct Meta Pixel and Conversion API setup so leads and sales are tracked accurately, even with browser privacy limits."],
["Campaign Optimization","Ongoing testing of audiences, creatives and budgets to lower your cost per lead and scale the ads that perform best."],
["Performance Reporting","Simple regular reports showing spend, leads, cost per result and what we will improve next, in plain language."]]}
];

var ch='<span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8h12"/><path class="v" d="M8 2v12"/></svg></span>';
var acc=document.getElementById("acc"),h="";

D.forEach(function(s,n){
  h+='<section class="svc"><button class="head" aria-expanded="false" aria-controls="p'+n+'" id="b'+n+'"><span class="ttl"><b>'+s.t+'</b><span>'+s.s+'</span></span>'+ch+'</button>';
  h+='<div class="panel" id="p'+n+'" role="region" aria-labelledby="b'+n+'"><div><p class="intro">'+s.i+'</p><div class="list">';

  s.l.forEach(function(x,m){
    var id=n+'_'+m;
    h+='<div class="item"><button class="q" aria-expanded="false" aria-controls="a'+id+'"><span>'+x[0]+'</span>'+ch+'</button><div class="panel" id="a'+id+'"><div><p class="ans">'+x[1]+'</p></div></div></div>';
  });

  h+='</div></div></div></section>';
});

acc.innerHTML=h;

var themeToggle=document.getElementById("themeToggle"),
    themeIcon=document.getElementById("themeIcon"),
    themeLabel=document.getElementById("themeLabel");

function currentTheme(){
  return document.documentElement.getAttribute("data-theme")==="light" ? "light" : "dark";
}

function updateThemeControl(theme){
  var dark=theme==="dark";
  themeToggle.setAttribute("aria-pressed",dark);
  themeToggle.setAttribute("aria-label",dark ? "Switch to light theme" : "Switch to dark theme");
  themeIcon.textContent=dark ? "☀" : "☾";
  themeLabel.textContent=dark ? "Light mode" : "Dark mode";
}

try{
  var savedTheme=localStorage.getItem("theme");
  if(savedTheme==="light" || savedTheme==="dark"){
    document.documentElement.setAttribute("data-theme",savedTheme);
  }
}catch(e){}

updateThemeControl(currentTheme());

themeToggle.addEventListener("click",function(){
  var next=currentTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",next);

  try{
    localStorage.setItem("theme",next);
  }catch(e){}

  updateThemeControl(next);
});

function set(btn,open){
  btn.setAttribute("aria-expanded",open);
  btn.parentElement.classList.toggle("open",open);
}

acc.addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(!b)return;

  var open=b.getAttribute("aria-expanded")!=="true";

  if(b.classList.contains("head")){
    acc.querySelectorAll(".head,.q").forEach(function(o){
      set(o,false);
    });

    set(b,open);

    if(open){
      setTimeout(function(){
        b.scrollIntoView({
          behavior:matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth",
          block:"start"
        });
      },320);
    }
  }else{
    b.closest(".list").querySelectorAll(".q").forEach(function(o){
      set(o,false);
    });

    set(b,open);
  }
});
</script>
</body>
</html>
