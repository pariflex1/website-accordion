<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Request a service — websites, apps, AI automation and Meta ads.">
<title>Request a service</title>
<script>
  try {
    var t = localStorage.getItem("theme");
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
</script>

<!-- Uber Move (proprietary — served from public CDN; falls back to Inter) -->
<link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.cdnfonts.com/css/uber-move-2" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/uber-move-text" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- Header -->
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#" aria-label="PRV Tech — home">
      <img src="Icon/logo-white.png" alt="PRV Tech" width="102" height="58">
    </a>
    <div class="header-actions">
      <button type="button" class="theme-btn" id="themeToggle" aria-pressed="false" aria-label="Switch to dark theme">
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
      <button type="button" class="status-btn" id="statusBtn">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-label">Status</span>
      </button>
    </div>
  </div>
</header>

<main id="main" class="page">

  <!-- Top category icons -->
  <nav class="cat-bar" id="categoryBar" aria-label="Service categories"></nav>

  <h1 class="page-title">Request a service</h1>

  <form class="request" id="requestForm" novalidate>

    <!-- Category dropdown -->
    <div class="dropdown dropdown--pill" id="categoryDropdown">
      <button type="button" class="dropdown-toggle" id="categoryToggle"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="categoryMenu"
              aria-label="Category">
        <span class="field-icon" data-icon="grid" aria-hidden="true"></span>
        <span class="dropdown-text">Category</span>
        <span class="chev" data-icon="chevron" aria-hidden="true"></span>
      </button>
      <ul class="dropdown-menu" id="categoryMenu" role="listbox" aria-label="Category" tabindex="-1" hidden></ul>
      <p class="inline-error" id="categoryError" hidden></p>
    </div>

    <!-- Service dropdown -->
    <div class="dropdown dropdown--block" id="serviceDropdown">
      <button type="button" class="dropdown-toggle" id="serviceToggle"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="serviceMenu"
              aria-label="Select service" aria-disabled="true">
        <span class="field-icon" data-icon="chip" aria-hidden="true"></span>
        <span class="dropdown-text">Select service</span>
        <span class="chev" data-icon="chevron" aria-hidden="true"></span>
      </button>
      <ul class="dropdown-menu" id="serviceMenu" role="listbox" aria-label="Select service" tabindex="-1" hidden></ul>
      <p class="inline-error" id="serviceError" hidden></p>
    </div>

    <!-- Fill your details -->
    <button type="button" class="field-btn" id="detailsBtn" aria-haspopup="dialog">
      <span class="field-icon" data-icon="clipboard" aria-hidden="true"></span>
      <span class="field-text">Fill your details</span>
      <span class="field-done" id="detailsDone" hidden>
        <span data-icon="check" aria-hidden="true"></span>
        <span>Completed</span>
      </span>
    </button>
    <p class="inline-error" id="detailsError" hidden></p>

    <!-- Submit -->
    <div class="request-actions">
      <button type="submit" class="btn btn--primary" id="submitBtn">
        <span class="spinner" aria-hidden="true" hidden></span>
        <span class="btn-label">Submit</span>
      </button>
    </div>

    <p class="form-note" id="formNote" role="alert" hidden></p>
  </form>

  <!-- Stack resources -->
  <section class="resources" aria-labelledby="resourcesTitle">
    <h2 id="resourcesTitle" class="resources-title">Stack Resources</h2>
    <div class="carousel" id="resourceCarousel">
      <div class="carousel-track" id="resourceTrack"></div>
    </div>
  </section>

</main>

<!-- Service preview -->
<section class="preview" aria-labelledby="previewTitle">
  <h2 id="previewTitle" class="preview-title">Preview</h2>
  <div class="preview-grid">
    <div class="preview-left">
      <div class="preview-current" id="previewCurrent">
        <div class="preview-cat" id="previewCat"></div>
        <div class="preview-svc" id="previewSvc"></div>
        <div class="preview-summary" id="previewSummary"></div>
      </div>
    </div>
    <div class="preview-right">
      <div class="preview-frame" id="previewFrame">
        <div class="preview-scene" id="previewScene" aria-hidden="true"></div>
        <div class="preview-highlight" id="previewHighlight" hidden></div>
      </div>
    </div>
  </div>
</section>

<!-- Sticky inquiry bar -->

<!-- Sticky inquiry bar -->
<button type="button" class="inquiry-bar" id="inquiryBtn" aria-haspopup="dialog">Inquiry</button>

<!-- A. Full-screen category services modal -->
<div class="modal modal--full" id="categoryModal" role="dialog" aria-modal="true"
     aria-labelledby="categoryModalTitle" tabindex="-1" hidden>
  <header class="full-head">
    <div class="full-head-text">
      <p class="eyebrow">Services</p>
      <h2 id="categoryModalTitle"></h2>
    </div>
    <button type="button" class="icon-btn" data-close aria-label="Close services">
      <span data-icon="close" aria-hidden="true"></span>
    </button>
  </header>
  <div class="full-body">
    <div class="accordion" id="serviceAccordion"></div>
  </div>
</div>

<!-- B. Fill your details modal -->
<div class="modal modal--card" id="detailsModal" role="dialog" aria-modal="true"
     aria-labelledby="detailsModalTitle" tabindex="-1" hidden>
  <div class="card">
    <header class="card-head">
      <h2 id="detailsModalTitle">Fill your details</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close details form">
        <span data-icon="close" aria-hidden="true"></span>
      </button>
    </header>
    <div class="tabs" id="detailsTabs" role="tablist" aria-label="Details sections"></div>
    <div class="card-body" id="detailsPanels"></div>
    <footer class="card-foot" id="detailsFoot"></footer>
  </div>
</div>

<!-- C. Inquiry modal -->
<div class="modal modal--card" id="inquiryModal" role="dialog" aria-modal="true"
     aria-labelledby="inquiryModalTitle" tabindex="-1" hidden>
  <div class="card card--narrow">
    <header class="card-head">
      <h2 id="inquiryModalTitle">How can we help?</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close inquiry">
        <span data-icon="close" aria-hidden="true"></span>
      </button>
    </header>
    <div class="choices" id="inquiryChoices"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="toast-icon" aria-hidden="true"></span>
  <span class="toast-text"></span>
  <button type="button" class="toast-close" aria-label="Dismiss message">
    <span data-icon="close" aria-hidden="true"></span>
  </button>
</div>

<noscript>
  <p style="max-width:640px;margin:24px auto;padding:0 20px;font:16px/1.5 system-ui">
    This service request form needs JavaScript to run. Please enable JavaScript and reload the page.
  </p>
</noscript>

</body>
</html>
