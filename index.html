<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Services</title>
<style>
:root{--bg:#fff;--ink:#1c2b33;--mute:#465a69;--line:#ced0d4;--acc:#0064e0;--btn:#e4e6eb;--btn-hover:#d8dbe0;--glow:rgba(0,100,224,.1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081217;--ink:#f1f6f9;--mute:#aab9c4;--line:#2a3d48;--acc:#65b5ff;--btn:#1c303b;--btn-hover:#294552;--glow:rgba(53,153,255,.2)}}
:root[data-theme="dark"]{--bg:#081217;--ink:#f1f6f9;--mute:#aab9c4;--line:#2a3d48;--acc:#65b5ff;--btn:#1c303b;--btn-hover:#294552;--glow:rgba(53,153,255,.2)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% -8%,var(--glow),transparent 33rem),var(--bg);color:var(--ink);font-family:"Optimistic Display","Optimistic Text","Segoe UI",Helvetica,Arial,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
main{max-width:800px;margin:0 auto;padding:32px 20px 56px}
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 16px}
h1{flex:1;font-size:clamp(2rem,8vw,3.5rem);line-height:1.08;font-weight:500;letter-spacing:-.03em;margin:0}
.theme-toggle{flex:none;display:inline-flex;align-items:center;gap:8px;width:auto;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--btn);color:var(--ink);font-size:.875rem;font-weight:600;line-height:1;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.theme-toggle:hover{background:var(--btn-hover)}
.theme-icon{width:16px;text-align:center;font-size:1.1rem;line-height:1}
.lead{color:var(--mute);font-size:1.0625rem;margin:0 0 32px;max-width:52ch}
button{font:inherit;color:inherit;background:none;border:0;width:100%;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.svc{border-top:1px solid var(--line)}
.svc:last-child{border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:16px;padding:22px 0;min-height:72px}
.ttl{flex:1}
.ttl b{display:block;font-size:clamp(1.25rem,5vw,1.75rem);line-height:1.2;font-weight:500;letter-spacing:-.015em}
.ttl span{display:block;margin-top:4px;font-size:.875rem;color:var(--mute)}
.ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--btn);display:grid;place-items:center;transition:background .2s}
.ic svg{width:16px;height:16px}
.ic .v{transform-origin:center;transition:transform .25s}
[aria-expanded="true"] .ic .v{transform:scaleY(0)}
[aria-expanded="true"] .ic{background:var(--acc);color:#fff}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.open>.panel{grid-template-rows:1fr}
.panel>div{overflow:hidden;min-height:0}
.intro{margin:0 0 12px;color:var(--mute);font-size:1rem;max-width:56ch}
.list{padding-bottom:20px}
.item{border-top:1px solid var(--line)}
.q{display:flex;align-items:center;gap:10px;padding:12px 0;min-height:48px;font-size:1rem;font-weight:500;line-height:1.3}
.q>span:first-child{flex:1}
.q .ic{width:26px;height:26px}
.q .ic svg{width:11px;height:11px}
.item.open .q{color:var(--acc)}
.ans{margin:0;padding:0 36px 14px 0;color:var(--mute);font-size:.97rem;line-height:1.55;max-width:60ch}
.rich-answer{padding-right:20px;max-width:72ch}
.rich-answer p{margin:0 0 14px}
.rich-answer p:last-child{margin-bottom:0}
.rich-answer h3{margin:0 0 4px;color:var(--ink);font-size:1rem;font-weight:600;line-height:1.35}
.rich-answer h3:not(:first-child){margin-top:18px}
.rich-answer ul{margin:0;padding:0;list-style:none}
.rich-answer li{position:relative;margin:0;padding-left:18px}
.rich-answer li+li{margin-top:12px}
.rich-answer li::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.stack-table-wrap{overflow-x:auto;margin:2px 0 6px;padding-bottom:4px}
.stack-table{width:100%;min-width:600px;border-collapse:collapse;font-size:.92rem;line-height:1.45}
.stack-table caption{padding:0 0 10px;color:var(--ink);font-size:1rem;font-weight:600;text-align:left}
.stack-table th,.stack-table td{padding:10px 12px;border:1px solid var(--line);vertical-align:top;text-align:left}
.stack-table th{color:var(--ink);background:var(--btn);font-weight:600}
.stack-table td:first-child{color:var(--ink);font-weight:600}
.glossary{display:grid;gap:12px;margin:0;padding-bottom:14px}
.glossary dt{color:var(--ink);font-weight:600;line-height:1.35}
.glossary dd{margin:3px 0 0}
@media (min-width:700px){main{padding-top:72px}.head{padding:28px 0}.q{padding:14px 0}}
@media (max-width:420px){.masthead{gap:10px}.theme-toggle{padding:8px 10px}.theme-label{display:none}}
@media (prefers-reduced-motion:reduce){.panel,.ic,.ic .v,.theme-toggle,body{transition:none}}
</style>
</head>
<body>

["Glossary of Technical Terms &amp; Acronyms","",`<div class="ans rich-answer">
<dl class="glossary">
<dt>API (Application Programming Interface)</dt><dd>A set of rules and protocols that allows different software systems or services to communicate and share data with each other automatically.</dd>
<dt>BaaS (Backend-as-a-Service)</dt><dd>A cloud service model that provides developers with ready-to-use backend infrastructure (databases, authentication, file storage) so they don't have to build server architecture from scratch.</dd>
<dt>CDN (Content Delivery Network)</dt><dd>A geographically distributed network of servers that caches website assets (images, code files) closer to users worldwide to deliver fast web page loading speeds.</dd>
<dt>CI/CD (Continuous Integration / Continuous Deployment)</dt><dd>Automated software engineering workflows where code updates are automatically tested, built, and pushed to live production servers whenever changes are made.</dd>
<dt>CMS (Content Management System)</dt><dd>A software platform (like WordPress) that lets users create, manage, and edit website content visually without manually writing HTML or backend code.</dd>
<dt>CRM (Customer Relationship Management)</dt><dd>Software systems used to manage, track, and organize business interactions with prospective leads, clients, and user data.</dd>
<dt>DNS (Domain Name System)</dt><dd>The internet's address book system that translates human-readable domain names (e.g., <code>example.com</code>) into computer IP addresses.</dd>
<dt>LLM (Large Language Model)</dt><dd>Advanced AI models, such as Gemini or OpenAI GPT models, trained on vast datasets to understand, generate, and reason with natural human language and code.</dd>
<dt>OAuth (Open Authorization)</dt><dd>An open standard protocol for secure access delegation (e.g., "Sign in with Google") that allows apps to verify user identity without directly accessing user passwords.</dd>
<dt>RAG (Retrieval-Augmented Generation)</dt><dd>An AI technique where a model retrieves factual, relevant information from an external database or document repository before generating an answer, preventing hallucinations and ensuring high accuracy.</dd>
<dt>RLS (Row Level Security)</dt><dd>A fine-grained database security strategy in PostgreSQL/Supabase that controls which specific rows of data individual users can view or modify based on their user roles.</dd>
<dt>SSL/TLS (Secure Sockets Layer / Transport Layer Security)</dt><dd>Standard cryptographic protocols that encrypt data transmitted over the internet, establishing secure HTTPS connections between web browsers and servers.</dd>
<dt>UI (User Interface)</dt><dd>The visual layout, buttons, menus, and forms that users directly view and interact with on a website or app screen.</dd>
</dl>
</div>`]]},
  
];

var ch='<span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8h12"/><path class="v" d="M8 2v12"/></svg></span>';
var acc=document.getElementById("acc"),h="";

D.forEach(function(s,n){
  h+='<section class="svc"><button class="head" aria-expanded="false" aria-controls="p'+n+'" id="b'+n+'"><span class="ttl"><b>'+s.t+'</b><span>'+s.s+'</span></span>'+ch+'</button>';
  h+='<div class="panel" id="p'+n+'" role="region" aria-labelledby="b'+n+'"><div><p class="intro">'+s.i+'</p><div class="list">';

  s.l.forEach(function(x,m){
    var id=n+'_'+m;
    var answer=x[2] || '<p class="ans">'+x[1]+'</p>';
    h+='<div class="item"><button class="q" aria-expanded="false" aria-controls="a'+id+'"><span>'+x[0]+'</span>'+ch+'</button><div class="panel" id="a'+id+'"><div>'+answer+'</div></div></div>';
  });

  h+='</div></div></div></section>';
});

acc.innerHTML=h;

var themeToggle=document.getElementById("themeToggle"),
    themeIcon=document.getElementById("themeIcon"),
    themeLabel=document.getElementById("themeLabel");

function currentTheme(){
  return document.documentElement.getAttribute("data-theme")==="light" ? "light" : "dark";
}

function updateThemeControl(theme){
  var dark=theme==="dark";
  themeToggle.setAttribute("aria-pressed",dark);
  themeToggle.setAttribute("aria-label",dark ? "Switch to light theme" : "Switch to dark theme");
  themeIcon.textContent=dark ? "☀" : "☾";
  themeLabel.textContent=dark ? "Light mode" : "Dark mode";
}

try{
  var savedTheme=localStorage.getItem("theme");
  if(savedTheme==="light" || savedTheme==="dark"){
    document.documentElement.setAttribute("data-theme",savedTheme);
  }
}catch(e){}

updateThemeControl(currentTheme());

themeToggle.addEventListener("click",function(){
  var next=currentTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",next);

  try{
    localStorage.setItem("theme",next);
  }catch(e){}

  updateThemeControl(next);
});

function set(btn,open){
  btn.setAttribute("aria-expanded",open);
  btn.parentElement.classList.toggle("open",open);
}

acc.addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(!b)return;

  var open=b.getAttribute("aria-expanded")!=="true";

  if(b.classList.contains("head")){
    acc.querySelectorAll(".head,.q").forEach(function(o){
      set(o,false);
    });

    set(b,open);

    if(open){
      setTimeout(function(){
        b.scrollIntoView({
          behavior:matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth",
          block:"start"
        });
      },320);
    }
  }else{
    b.closest(".list").querySelectorAll(".q").forEach(function(o){
      set(o,false);
    });

    set(b,open);
  }
});
</script>
</body>
</html>
